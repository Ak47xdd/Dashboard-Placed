apiVersion: v1
kind: ConfigMap
metadata:
  name: web-content
data:
  index.html: |
    <!DOCTYPE html>
    <html>
    <body>
      <div>
      <a href="dashboard.html" class="link">Open Dashboard</a>
      </div>
    </body>
    </html>
---
apiVersion: v1
kind: Pod
metadata:
  name: custom-web-pod
  labels:
    app: web
spec:
  containers:
    - name: nginx-container
      image: nginx
      ports:
        - containerPort: 80
      volumeMounts:
        - name: html-volume
          mountPath: /usr/share/nginx/html
  volumes:
    - name: html-volume
      configMap:
        name: web-content
